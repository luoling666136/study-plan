<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<!-- 手机端：可加到主屏。图标与清单和本文件同目录，由 mobile/serve.mjs 一起提供；
     直接双击本文件（file://）时这几个链接会 404，不影响使用 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="三轨计划">
<meta name="mobile-web-app-capable" content="yes">
<title>三轨学习计划 · 软考 + AI 实习 + 六级</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#111c31; --card:#141f36; --card2:#1a2740;
    --line:#243454; --txt:#e7eefc; --dim:#8ea3c4; --dim2:#63799c;
    --rk:#4c9aff; --ai:#7c5cff; --en:#2fd18a;
    --ok:#2fd18a; --warn:#ffb020; --bad:#ff5d6c; --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 15% -10%, #1b2b4d 0%, transparent 60%),
               radial-gradient(900px 500px at 100% 0%, #2a1f4d 0%, transparent 55%),
               var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.55; padding:14px 14px 96px; max-width:820px; margin:0 auto;
  }
  h1{font-size:19px;margin:0 0 3px}
  h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h2 .badge{font-size:11px;font-weight:500;color:var(--dim);background:var(--bg2);
    border:1px solid var(--line);padding:1px 7px;border-radius:20px}
  h3{font-size:13px;margin:14px 0 7px;color:var(--dim)}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:12px}
  .card{background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);
    border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .between{justify-content:space-between}
  .grow{flex:1;min-width:0}
  .muted{color:var(--dim)} .tiny{font-size:12px} .micro{font-size:11px}
  .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .hide{display:none!important}

  /* 倒计时 */
  .counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  @media(max-width:560px){.counts{grid-template-columns:1fr}}
  .cd{background:#0f1a2e;border:1px solid var(--line);border-radius:12px;padding:10px 11px;position:relative;overflow:hidden}
  .cd::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#4c9aff)}
  .cd .n{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-1px}
  .cd .l{font-size:11.5px;color:var(--dim);margin-top:1px}
  .cd .d{font-size:11px;color:var(--dim2);margin-top:3px}

  /* 进度条 */
  .bar{height:7px;background:#0d1729;border-radius:99px;overflow:hidden;margin-top:9px;border:1px solid #1d2b47}
  .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--rk),var(--ai));transition:width .45s cubic-bezier(.22,.8,.3,1)}
  .bar.sm{height:5px;margin-top:6px}

  /* KPI */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:#0f1a2e;border:1px solid var(--line);border-radius:12px;padding:9px 10px}
  .kpi b{display:block;font-size:19px;font-weight:700;letter-spacing:-.3px}
  .kpi span{font-size:11.5px;color:var(--dim)}

  /* Tab */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin-bottom:12px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;font-size:13px;padding:7px 13px;border-radius:99px;border:1px solid var(--line);
    background:#0f1a2e;color:var(--dim);cursor:pointer;transition:.15s;white-space:nowrap}
  .tab:hover{border-color:#3a5b90;color:var(--txt)}
  .tab.on{background:linear-gradient(92deg,rgba(76,154,255,.22),rgba(124,92,255,.18));border-color:var(--rk);color:#fff}

  /* 打卡项 */
  ul.todo{list-style:none;margin:0;padding:0}
  ul.todo li{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);
    border-radius:12px;margin-bottom:7px;background:#0f1a2e;cursor:pointer;transition:.16s}
  ul.todo li:hover{border-color:#33507f}
  ul.todo li.done{opacity:.5;border-color:#1f4b39;background:#0d1c19}
  ul.todo li.done .t{text-decoration:line-through}
  ul.todo li .tl{flex:0 0 3px;align-self:stretch;border-radius:99px;background:var(--c,#4c9aff);opacity:.85}
  .chk{width:19px;height:19px;flex:0 0 19px;border-radius:6px;border:1.8px solid #3a537d;margin-top:1px;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:.16s}
  ul.todo li.done .chk{background:var(--ok);border-color:var(--ok);color:#04221a}
  .t{font-size:13.5px}
  .det{font-size:11.5px;color:var(--dim2);margin-top:3px;line-height:1.45}
  .tag{font-size:10.5px;color:var(--dim2);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px;white-space:nowrap}
  .tag.h{color:#cfe2ff;border-color:#33507f}
  .est{font-size:10.5px;color:var(--dim2);margin-left:6px}

  /* 表单 */
  label.f{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;background:#0c1526;border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--rk)}
  textarea{resize:vertical;min-height:62px;line-height:1.5}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .chip{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);
    background:#0f1a2e;color:var(--dim);cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--rk);color:var(--txt)}
  .chip.on{background:rgba(76,154,255,.16);border-color:var(--rk);color:#cfe2ff}
  .moods{display:flex;gap:6px}
  .mood{flex:1;text-align:center;font-size:12px;padding:7px 0;border-radius:10px;border:1px solid var(--line);
    background:#0f1a2e;color:var(--dim);cursor:pointer}
  .mood.on{background:rgba(124,92,255,.18);border-color:var(--ai);color:#e2d9ff}

  button{font:inherit;cursor:pointer;border-radius:11px;border:1px solid var(--line);
    background:#16233b;color:var(--txt);padding:9px 14px;transition:.15s}
  button:hover{border-color:#3a5b90}
  button:active{transform:translateY(1px)}
  button.primary{background:linear-gradient(92deg,var(--rk),var(--ai));border:none;color:#fff;font-weight:600;
    box-shadow:0 6px 18px rgba(76,154,255,.28)}
  button.ghost{background:transparent;color:var(--dim);font-size:12px;padding:6px 10px}
  .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

  canvas{width:100%;height:170px;display:block}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--dim);margin-top:6px;flex-wrap:wrap}
  .dot{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:5px}

  /* 周计划 */
  .wk{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);
    border-radius:12px;margin-bottom:7px;background:#0f1a2e;cursor:pointer;transition:.15s}
  .wk:hover{border-color:#33507f}
  .wk.cur{border-color:var(--rk);background:linear-gradient(90deg,rgba(76,154,255,.12),rgba(124,92,255,.06))}
  .wk.past{opacity:.45}
  .wn{flex:0 0 40px;height:40px;border-radius:10px;background:#16233b;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:10.5px;color:var(--dim);line-height:1.15}
  .wn b{font-size:14px;color:var(--txt)}
  .wt{font-size:13px;font-weight:600;margin-bottom:2px}
  .wd{font-size:11.5px;color:var(--dim);line-height:1.5}
  .ph{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:5px;margin-left:6px;white-space:nowrap}
  .wdetail{margin:8px 0 0;padding:10px 0 2px;border-top:1px dashed #243454}
  .wdetail .li{font-size:12px;color:var(--dim);padding:3px 0 3px 9px;position:relative;line-height:1.5}
  .wdetail .li::before{content:"";position:absolute;left:1px;top:11px;width:4px;height:4px;border-radius:99px;background:var(--c,#4c9aff)}
  .wdetail .mi{font-size:11.5px;margin-top:7px;padding:6px 9px;border-radius:8px;background:#0d1729;border:1px solid #1d2b47;color:#9fc0ef}

  /* 错题 / 记录 */
  .bug{border-left:2px solid var(--bad);padding:6px 0 6px 10px;margin-bottom:9px}
  .bug .bt{font-size:13px}
  .bug .bm{font-size:11px;color:var(--dim2);margin-top:2px}
  .bug .ans{font-size:11.5px;color:var(--warn);margin-top:2px}
  details summary{cursor:pointer;color:var(--dim);font-size:12.5px;outline:none}
  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(14px);
    background:#16233b;border:1px solid var(--rk);color:#fff;padding:9px 17px;border-radius:99px;
    font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(11,18,32,.5),rgba(11,18,32,.96) 45%);backdrop-filter:blur(8px);z-index:50}
  .sticky .inner{max-width:792px;margin:0 auto;display:flex;gap:8px;align-items:center}
  hr{border:none;border-top:1px solid var(--line);margin:14px 0}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:5px 6px;border-bottom:1px solid #1a2740}
  th{color:var(--dim);font-weight:500}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid #1a2740}
  .flash{animation:fl .6s ease}
  @keyframes fl{from{background:rgba(76,154,255,.18)}to{background:transparent}}
  /* 宽屏：教师/教室单独一列，课程名里那份隐藏 */
  .ct-teacher{display:none}

  /* ============ 手机适配 ============ */
  @media (max-width:640px){
    body{padding:12px 10px 104px;font-size:15px}
    .card{padding:12px;border-radius:14px}
    /* iOS Safari 对 font-size<16px 的输入框会自动放大整页 —— 手机上钉到 16px */
    input[type=text],input[type=number],input[type=date],textarea,select{font-size:16px;padding:10px 11px}
    .tab{padding:8px 14px;font-size:13.5px}
    ul.todo li{padding:11px 10px}
    /* 触控热区：iOS 建议 ≥44px，否则容易点错 */
    .mood{padding:13px 0;font-size:12.5px}
    .chip{padding:9px 13px}
    .t{font-size:14px}
    .det{font-size:12px}
    .cd .n{font-size:26px}
    .counts{gap:7px}
    .wn{flex:0 0 34px;height:34px}
    /* 课表在窄屏：教师/教室并进课程名里，不再单占一列 */
    .ct-teacher{display:block;margin-top:2px}
    .ct-full{display:none}
    th:nth-child(4){display:none}
    button{padding:10px 14px}
    .btns button{flex:1 1 auto}
    canvas{height:150px}
  }
  @media (max-width:400px){
    h1{font-size:17px}
    .kpi b{font-size:17px}
    .wk{gap:8px;padding:9px}
  }
  /* 触屏：去掉 hover 依赖，缩小点击热区误差 */
  @media (hover:none){
    ul.todo li:hover{border-color:var(--line)}
    .wk:hover{border-color:var(--line)}
    .chip:hover{border-color:var(--line)}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="sticky"><div class="inner">
  <span id="stickyTxt" style="font-size:12.5px" class="muted">今天还没打卡</span>
  <span class="grow"></span>
  <button class="primary" id="stickyBtn">一键保存今日</button>
</div></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   三轨学习计划 · 罗灵专用
   轨1 软考 软件设计师（2027 上，5 月下旬）
   轨2 AI 应用开发 → 2027-02 投暑期实习简历
   轨3 英语六级（2027-06）
   数据全部存本机 localStorage；可导出 JSON 备份。
   ============================================================ */

/* ---------- 1. 关键日期（可改） ---------- */
const DEFAULT_EXAMS = {
  rk: {label:"软考 软件设计师", date:"2027-05-23", note:"湖南往年 5 月下旬；3 月起每周查官方通知", color:"var(--rk)"},
  ai: {label:"AI 简历投递",      date:"2027-02-15", note:"暑期实习硬 deadline，不等学完", color:"var(--ai)"},

};
const W1_MON = "2026-09-14";              // 第 1 周周一（计划起点）
const WEEK_HOUR_TARGET = 20;              // 每周有效学习小时目标（AI 路线自述 20–25h，取下沿）
const TRACK = {
  rk:{name:"软考",  short:"软考", color:"#4c9aff", cls:"rk"},
  ai:{name:"AI 应用开发", short:"AI",  color:"#7c5cff", cls:"ai"},
  en:{name:"六级英语", short:"六级", color:"#2fd18a", cls:"en"},
  life:{name:"节奏/体能", short:"节奏", color:"#ffb020", cls:"life"}
};

/* ---------- 2. 42 周三轨主线（日期由 W1_MON 自动推算） ---------- */
/* [软考, AI应用开发, 六级, 维护项, 里程碑] */
const RAW_WEEKS = [
["阶段一 启动：裸测摸底 + 第一个小工具",
 "软考：下真题（主库实际覆盖 2020上–2024上；2023 下与 2025 另找，见「节奏与速查 → 真题与资料」）；打印大纲考点清单贴墙；装 Anki 建端口号卡组",
 "装 Python venv / Git / VS Code，建第一个 GitHub 仓库；命令行待办清单（增删改查 + JSON 存储）",
 "六级自测 1 套真题（只记分数当基线）；建 100 词/天的生词本",
 "三条线各建一个记录本：软考错题本、AI 提交日志（git log）、六级生词本",

["计算机组成（跟课）：数据表示 + 线性表/栈/队列",
 "组成：进制转换、原码/反码/补码、补码加减与溢出判断（双符号位）",
 "Python 基本语法补洞：文件读写、异常、json、argparse；把待办清单补上删除与查询",

["计算机组成（跟课）：寻址方式 + 串与 KMP",

 "② 批量文件重命名器：读目录、按规则改名、带 --dry-run 预演（字符串处理就在这练）",
 "六级词汇 100 词/天；听力 15 分钟；每周 1 篇阅读精读",

["数据结构：树与二叉树",
 "二叉树遍历（前/中/后序）互相还原、线索二叉树、哈夫曼树与 WPL 计算",
 "③ API 查询小工具：requests 调真实接口 + 异常处理 + 结果缓存（为调大模型 API 铺路）",
 "六级词汇 100 词/天；听力 15 分钟；每周 1 篇阅读精读",
 "LeetCode 每天 1 道；晨读卡继续",
 "③ 工具上 GitHub → 阶段 0 达标：3 个能跑的仓库 + 3 份 README"],

["数据结构：二叉排序树 + AVL + 图基础",

 "六级词汇 100 词/天；听力 20 分钟；每周 1 套真题听力部分",
 "LeetCode 每天 1 道（简单 → 中等）",
 "阶段 0 的三块内容：能独立写完并跑通"],

["数据结构：图算法 + 查找",

["计算机网络（跟课）+ OS 进程管理",
 "网络：OSI 七层 / TCP-IP 四层、各层协议归属、20 个协议归位（顺手喂给 RAG 的检索分层理解）",
 "流式输出的多轮会话历史管理、上下文裁剪、token 预算控制",
 "六级词汇 100 词/天；听力 20 分钟；每周 1 套真题听力",
 "LeetCode 每天 1 道",
 "能默画层次表并把 20 个协议归位"],

["网络：子网划分 + TCP｜OS：调度与 PV 操作",
 "子网掩码 / CIDR / 可用主机数；TCP 三次握手、四次挥手、TCP vs UDP 标志位与状态",
 "DS 换 CSS（流式前端页）；写 Dockerfile 把服务打包，本机 docker run 能起",
 "六级词汇 100 词/天；听力 20 分钟；每周 1 套真题听力",
 "LeetCode 每天 1 道",

const DAY_MS = 86400000;
/* 日期核：一律先规范化成 Date，避免字符串/数字/跨 realm Date 混进来炸掉（实测踩过） */
function toDate(v){
  if(v instanceof Date) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  if(typeof v === "number") return new Date(v, 0, 1);
  if(typeof v === "string"){
    const m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m) return new Date(+m[1], +m[2]-1, +m[3]);
    const d = new Date(v);
    return isNaN(d.getTime()) ? new Date() : new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  if(v && typeof v.getFullYear === "function") return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  return today0();
}
function ymd(v){ const d=toDate(v); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseYmd(s){ return toDate(s); }
function today0(){ const n=new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function dkey(v){ return ymd(v==null? new Date() : v); }
function dayDiff(a,b){ return Math.round((toDate(b)-toDate(a))/DAY_MS); }
function mondayOf(d){ const x=toDate(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
function weekIndex(d){ return Math.floor(dayDiff(W1_MON, d==null? new Date() : d)/7); }   // 0-based
function weekStart(i){ const d=toDate(W1_MON); d.setDate(d.getDate()+Math.round(Number(i)||0)*7); return d; }
function weekEnd(i){ const d=weekStart(i); d.setDate(d.getDate()+6); return d; }
function fmtMD(v){ const d=toDate(v); return (d.getMonth()+1)+"月"+d.getDate()+"日"; }
function fmtMD2(v){ const d=toDate(v); return String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0"); }
function dow(v){ const g=toDate(v).getDay(); return g===0?7:g; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function round1(v){ return Math.round(v*10)/10; }
function wkRange(i){ return fmtMD(weekStart(i))+" – "+fmtMD(weekEnd(i)); }

/* 教学周（1..16）内该课是否出现 */
function courseActive(c, calWeek){
  const lw = dayDiff(TERM_START, weekStart(calWeek))/7 + 1;   // 教学周 1-based
  if(!(lw>=1 && lw<=TERM_WEEKS)) return false;                // 学期结束后（含寒假）没有课
  if(c.weeks==="all") return true;
  if(c.weeks==="odd") return lw%2===1;
  if(c.weeks==="even") return lw%2===0;
  if(c.weeks==="all12") return lw<=12;
  if(Array.isArray(c.weeks)) return c.weeks.includes(lw);
  return true;
}
function coursesOn(d){
  const wi = weekIndex(d), dw = dow(d);
  return COURSES.filter(c=>c.d===dw && c.name!=="—" && courseActive(c, wi));
}

/* 重活分级 + 每轨当日的绝对上限（分钟）。

   软考真题卷固定在周五（上午卷）与周六（下午卷）。 */
function dayScale(dw){
  if(dw===3) return 0.12;   // 周三：03-04 + 05-06 + 07-08 三节连堂，全天停摆
  if(dw===1) return 0.45;   // 周一：03-04 组成 + 05-06 网络，8:00–16:00 全在上课
  return 1;
}
function trackCap(track, dw){
  if(dw===6 || dw===7) return track==="rk" ? 300 : (track==="ai" ? 180 : 60);
  if(dw===3) return 30;                      // 停摆日只有晨读
  if(track==="rk") return dw===1 ? 40 : 60;  // 工作日软考：一块知识点 + 十道题就到顶
  if(track==="ai") return 35;                // 写代码块：能产出一次提交的最小体量
  return 25;                                 // 六级：词汇 + 精听
}
/* 当天真实可用的自主学习分钟数（不是块的容量，而是扣掉课与连堂后的余量） */
function dayBudgetMin(d){
  const wi = weekIndex(d);
  if(wi<0) return 0;
  const dw = dow(d), b = BLOCKS[dw-1];
  if(dw===3) return 30;                                  // 地狱日：只留晨读
  if(dw===1){
    const lw = dayDiff(TERM_START, weekStart(wi))/7 + 1;
    return lw<=12 ? 60 : 75;                             // 组成原理结课后周一松 15 分钟
  }
  return b.min;
}

  if(wi<37){
    if(dw===3){
      push({id:"rk-am", track:"rk", kind:"light", est:10,

                        : "晚 19:30 起第一块（25 min 学一块 + 25 min 做该知识点的真题）")});

               : (dw===3 ? "AI：只读不写（地铁上/睡前翻文档）"
                         : "AI：写代码块 → 必须产出一次提交"),
          detail:esc(W[2]),
          slot: dw===6 ? "14:00–17:30 项目攻坚 + 19:30–21:00 继续" :
                dw===7 ? "09:00–12:00 项目 / 14:30–17:30 学习" :

    slot:"14:30–15:30"});

  /* --- 每日铁律 / 固定项 --- */
  const dwName=["mon","tue","wed","thu","fri","sat","sun"][dw-1];
  FIXED.forEach(f=>{
    if(f.days && !f.days.includes(dwName)) return;
    if(f.key==="morning") return;   // 已用卡片形式插入
    push({id:f.key, track:f.track, kind:"must", est:f.est, title:f.title, detail:f.detail,
          slot: f.key==="lc" ? "碎片时间（手机 App）" : "周日 20:00–20:20"});
  });

  /* --- 有课的日子插入联动提示 --- */
  coursesOn(d).filter(c=>c.link && c.tip).forEach((c,idx)=>{
    push({id:"link"+idx, track:"rk", kind:"tip", est:0,
          title:"📚 "+c.sec+" "+c.name+"（"+c.teacher+" · "+c.room+"）",
          detail:esc(c.tip), slot:"上课当天，笔记里补一句"});
  });

  /* --- 分配时长（targets = 今日各轨任务量之和；pool 仅用于展示"还有多少弹性时间"） --- */
  const alloc = allocMinutes(dayMin, dw, wts, items);
  return {week:wi, items, courses:coursesOn(d), budget:dayMin, alloc, phase:planPhase(wi),
          W, wts, card};
}
function allocMinutes(dayMin, dw, wts, items){
  const fixed = items.filter(i=>i.kind==="must").reduce((s,i)=>s+i.est,0);
  let pool = Math.max(0, dayMin - fixed);
  if(dw===5 || dw===6) pool = Math.max(0, pool - 150);   // 整卷占掉
  const keys = Object.keys(wts).filter(k=>k!=="life");
  const total = keys.reduce((s,k)=>s+(wts[k]||0),0) || 1;
  const out = {};
  keys.forEach(k=>{ out[k] = Math.round(pool*(wts[k]||0)/total); });
  if(!items.some(i=>i.kind!=="tip" && i.track==="ai")) { out.rk=(out.rk||0)+(out.ai||0); out.ai=0; }
  if(!items.some(i=>i.kind!=="tip" && i.track==="en")) { out.rk=(out.rk||0)+(out.en||0); out.en=0; }
  out._fixed = fixed;
  // 每轨今日任务量（各项之和），再按「当天真实能挤出的量」夹上限
  const raw = {rk:0, ai:0, en:0};
  items.forEach(i=>{ if(i.kind!=="tip" && raw[i.track]!=null) raw[i.track] += (i.est||0); });
  const cap = {rk: trackCap("rk",dw), ai: trackCap("ai",dw), en: trackCap("en",dw)};
  const tg = {rk:0, ai:0, en:0};
  keys.forEach(k=>{ tg[k] = Math.min(raw[k], cap[k]); });
  out._tasks = raw;
  out._targets = tg;
  out._total = tg.rk + tg.ai + tg.en;
  return out;
}

let DB = JSON.parse(JSON.stringify(EMPTY));
function load(){ try{ const s=localStorage.getItem(KEY); if(s){ const o=JSON.parse(s); DB=Object.assign(JSON.parse(JSON.stringify(EMPTY)),o); } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast("保存失败：浏览器存储不可用（无痕模式？）"); } }
function exams(){ return Object.assign({}, DEFAULT_EXAMS, DB.exams||{}); }
function dRec(k){ return DB.checks[k] || (DB.checks[k]={done:[],mood:"",note:""}); }
function dayHours(k){ return DB.hours[k]!=null ? DB.hours[k] : null; }

/* ---------- 10. 统计 ---------- */
function doneCount(k){ const r=DB.checks[k]; return r&&r.done? r.done.length : 0; }
function dayActive(k){ const r=DB.checks[k]; return !!(r && ((r.done&&r.done.length) || r.note)) || dayHours(k)>0; }
function streakDays(){
  let n=0; const d=today0();
  for(let i=0;i<3000;i++){
    const k=dkey(d), active=dayActive(k);
    if(active) n++;
    else if(i>0) break;
    d.setDate(d.getDate()-1);
  }
  return n;
}
function trackTotals(){
  const t={rk:0, ai:0, en:0};
  Object.keys(DB.hours).forEach(k=>{
    const rec=DB.hours[k]; if(!rec) return;
    Object.keys(t).forEach(x=>{ t[x] += Number(rec[x]||0); });
  });
  return t;
}
function weekHours(i){
  let sum=0; const s=weekStart(i);
  for(let j=0;j<7;j++){ const d=new Date(s); d.setDate(s.getDate()+j);
    const rec=DB.hours[dkey(d)]; if(rec) Object.keys(rec).forEach(x=>{ sum+=Number(rec[x]||0); }); }
  return sum;
}
function scoreStats(){
  const s=DB.scores||[];
  const rk=s.filter(x=>x.type==="rk"), en=s.filter(x=>x.type==="en");
  const avg=(arr,f)=>{ const a=arr.map(x=>Number(x[f])).filter(v=>!isNaN(v)&&v>0); return a.length? Math.round(a.reduce((p,c)=>p+c,0)/a.length*10)/10 : null; };
  return {rk, en, rkAm:avg(rk,"am"), rkPm:avg(rk,"pm"), enTotal:avg(en,"total"), lastRk:rk.length?rk[rk.length-1]:null, lastEn:en.length?en[en.length-1]:null};
}

/* ---------- 11. 视图：概览 ---------- */
let TAB = "overview";
function render(){
  const wi=weekIndex(new Date());
  const html = []
    .concat(headHTML())
    .concat(tabsHTML())
    .concat(TAB==="overview" ? overviewHTML() : [])
    .concat(TAB==="today"    ? todayHTML()    : [])
    .concat(TAB==="weeks"    ? weeksHTML()    : [])
    .concat(TAB==="scores"   ? scoresHTML()   : [])
    .concat(TAB==="bugs"     ? bugsHTML()     : [])
    .concat(TAB==="rhythm"   ? rhythmHTML()   : []);
  document.getElementById('app').innerHTML = html.join("");
  bind();
  if(TAB==="scores") drawChart();
  renderSticky();
}
function headHTML(){
  const E=exams(), t=today0();
  const items=[["rk",E.rk],["ai",E.ai],["en",E.en]];
  const cds = items.map(([k,e])=>{
    const dd = dayDiff(t, e.date);
    const cls = dd<0 ? "已过" : (dd===0 ? "就在今天" : "天后");
    return '<div class="cd" style="--c:'+TRACK[k].color+'">'+
      '<div class="n mono">'+(dd<0?"—":dd)+'</div>'+
      '<div class="l">'+esc(TRACK[k].name)+' · '+cls+'</div>'+
      '<div class="d">'+e.date.slice(5).replace("-","/")+'　'+esc(e.note||"")+'</div></div>';
  }).join("");
  const wi=weekIndex(t);
  return '<h1>三轨学习计划</h1>'+
    '<div class="sub">软考 软件设计师 · AI 应用开发实习 · 英语六级　｜　数据只存本机浏览器，记得偶尔导出备份</div>'+
    '<div class="card"><div class="counts">'+cds+'</div>'+
      '<div class="tiny muted" style="margin-top:10px">'+timelineText()+'</div>'+
      '<div class="micro" style="margin-top:8px;color:var(--dim2)">日期都是「预测值」：软考按往年 5 月下旬推算，六级按 6 月中旬周六推算。官方一公布就去「节奏与速查 → 关键日期」改，倒计时与周定位会自动重算。</div></div>';
}
function timelineText(){
  const wi=weekIndex(new Date());
  if(wi<0) return "计划自 "+W1_MON+"（第 1 周）开始。";
  if(wi>=RAW_WEEKS.length) return "42 周计划已走完，进入收官阶段。";
  const W=RAW_WEEKS[wi], ph=planPhase(wi);
  return "当前 <b>W"+(wi+1)+"</b>（"+wkRange(wi)+"）· "+
    '<span class="ph" style="background:'+ph.color+'22;color:'+ph.color+'">'+esc(ph.name)+'</span>'+
    '<br><span style="color:var(--txt)">'+esc(W[0])+'</span>';
}
function tabsHTML(){
  const T=[["overview","概览"],["today","今日打卡"],["weeks","周计划"],["scores","复盘数据"],["bugs","错题/卡点"],["rhythm","节奏与速查"]];
  return '<div class="tabs">'+T.map(([k,n])=>
    '<div class="tab'+(TAB===k?" on":"")+'" data-tab="'+k+'">'+n+'</div>').join("")+'</div>';
}

  const daysPassed = clamp(dayDiff(W1_MON,t), 0, dayDiff(W1_MON,E.en.date));
  const totalDays = Math.max(1, dayDiff(W1_MON,E.en.date));

    .map(k=>'<span class="tag h">'+TRACK[k].short+' '+(Math.round(T.alloc._targets[k]/60*10)/10)+'h</span>').join(" ");
  const hb = trackTotals();
  const targetHtml = ["rk","ai","en"].map(k=>{
    const target = k==="rk"?260:(k==="ai"?380:70);

  const next = (wi+1>=0&&wi+1<RAW_WEEKS.length)? {i:wi+1, w:RAW_WEEKS[wi+1]} : null;
  return [
  '<div class="card"><h2>总体进度 <span class="badge">到六级考试日</span></h2>',
    '<div class="row between"><span class="tiny muted">'+W1_MON+' → '+E.en.date+'</span><span class="tiny mono">'+overall+'%</span></div>',
    '<div class="bar"><i style="width:'+overall+'%"></i></div>',
    '<div class="grid" style="margin-top:12px">',
      '<div class="kpi"><b class="mono">'+streakDays()+'</b><span>连续打卡（天）</span></div>',
      '<div class="kpi"><b class="mono">'+round1(hb.rk+hb.ai+hb.en)+'</b><span>累计投入（h）</span></div>',
      '<div class="kpi"><b class="mono">'+round1(wh)+'</b><span>本周（h）</span></div>',
      '<div class="kpi"><b class="mono">'+(ss.rkAm!=null?ss.rkAm:"–")+'</b><span>软考上午均分</span></div>',
    '</div>',
    '<div class="tiny muted" style="margin-top:10px">本周目标 '+WEEK_HOUR_TARGET+' 小时'+(wh>0?"（已 '+wkPct+'%）":"")+'</div>',
    '<div class="bar sm"><i style="width:'+wkPct+'%"></i></div>',
    '<h3>三轨累计 vs 目标</h3>', targetHtml,
  '</div>',
  '<div class="card"><h2>今天该怎么走 <span class="badge">'+fmtMD(t)+' 周'+["一","二","三","四","五","六","日"][dow(t)-1]+'</span></h2>',
    (wi<0||wi>=RAW_WEEKS.length)? '<div class="tiny muted">不在计划周期内。</div>' : [
      '<div class="tiny muted">'+esc(BLOCKS[dow(t)-1].label)+'　可用约 '+T.budget+' 分钟</div>',
      '<div style="margin-top:8px" class="tiny">今日任务量：'+(allocTxt||'<span class="muted">今天没有专题任务</span>')+
        (T.alloc&&T.alloc._total? '<span class="muted">　合计约 '+Math.round(T.alloc._total/60*10)/10+' h</span>':'')+'</div>',

      '<div style="margin-top:10px" class="tiny">建议时间块：<b>'+esc(BLOCKS[dow(t)-1].t||"—")+'</b></div>',
      T.courses.length? '<div class="tiny" style="margin-top:8px;color:var(--warn)">📚 今天有课：'+T.courses.map(c=>esc(c.name.split("／").pop())+"（"+c.sec+"）").join("、")+'</div>' : '<div class="tiny muted" style="margin-top:8px">今天没课，整块时间归你</div>',

    ].join(""),

      triLine("rk","软考 软件设计师", W[0], W[1]) +
      triLine("ai","AI 应用开发", null, W[2]) +
      triLine("en","英语六级", null, W[3]) +
      (W[4]? triLine("life","节奏 / 维护", null, W[4]) : '') +
      '<div class="mi" style="font-size:11.5px;margin-top:8px;padding:8px 10px;border-radius:8px;background:#0d1729;border:1px solid #1d2b47;color:#9fc0ef">🎯 里程碑：'+esc(W[5])+'</div>'+

    }
    return '<div class="card"><h2>近 5 周投入</h2><div class="row" style="gap:6px;align-items:stretch">'+cells.join("")+'</div></div>';
  })()
  ].join("");
}
function triLine(key, label, head, body){
  if(body==null) return "";
  return '<div style="margin-bottom:9px;padding-left:9px;border-left:3px solid '+TRACK[key].color+'">'+
    '<div class="tiny" style="color:'+TRACK[key].color+';font-weight:600">'+esc(label)+'</div>'+
    (head? '<div class="tiny" style="color:var(--txt)">'+esc(head)+'</div>':'')+
    '<div class="det">'+esc(body)+'</div></div>';
}

    const tg = (T.alloc && T.alloc._targets) ? T.alloc._targets[x] : 0;
    const v = H[x]!=null? H[x] : (tg? Math.round(tg/60*10)/10 : "");

function drawChart(){
  const c=document.getElementById("chart"); if(!c) return;
  const ctx=c.getContext("2d");
  if(!ctx) return;
  // 手机适配：内部像素改成「显示宽度 × DPR」，字号也随宽度缩放，
  // 否则桌面上按 1400px 画的 20px 字在 390px 屏上会被压成 ~5px，完全读不出来。
  const cssW = Math.max(240, Math.round(c.clientWidth || 320));
  const cssH = clamp(cssW * 0.52, 168, 300);
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  if(c.width !== Math.round(cssW*dpr) || c.height !== Math.round(cssH*dpr)){
    c.width = Math.round(cssW*dpr); c.height = Math.round(cssH*dpr);
  }
  c.style.height = cssH + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=cssW, H=cssH;
  ctx.clearRect(0,0,W,H);
  const f  = clamp(W/430, 0.78, 1.5);                 // 字号缩放因子
  const px = n => Math.round(n*f*10)/10 + "px";
  const pad={l:Math.round(38*f), r:14, t:Math.round(16*f), b:Math.round(30*f)};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const y=v=>pad.t+ih-(clamp(v,0,75)/75)*ih;
  const lw = n => Math.max(1, Math.round(n*f*10)/10);
  ctx.font=px(12); ctx.strokeStyle="#1d2b47"; ctx.lineWidth=lw(1);
  [0,15,30,45,60,75].forEach(v=>{
    ctx.beginPath(); ctx.moveTo(pad.l,y(v)); ctx.lineTo(pad.l+iw,y(v)); ctx.stroke();
    ctx.fillStyle="#63799c"; ctx.fillText(String(v), 4, y(v)+Math.round(4*f));
  });
  ctx.strokeStyle="#ff5d6c"; ctx.setLineDash([5,5]); ctx.lineWidth=lw(1.6);
  ctx.beginPath(); ctx.moveTo(pad.l,y(45)); ctx.lineTo(pad.l+iw,y(45)); ctx.stroke(); ctx.setLineDash([]);

  const s=(DB.scores||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  if(!s.length){
    ctx.fillStyle="#63799c"; ctx.font=px(13);
    ctx.fillText("还没有记录 —— 每周复盘时填一次", pad.l+8, pad.t+ih/2);
    return;
  }
  const n=s.length;
  const x=i=> n===1 ? pad.l+iw/2 : pad.l + iw*i/(n-1);
  const series=[
    {key:"am",   color:"#4c9aff", test:v=>v.type!=="en"},
    {key:"pm",   color:"#7c5cff", test:v=>v.type!=="en"},
    {key:"total",color:"#2fd18a", test:v=>v.type==="en", scale:1/10}
  ];
  series.forEach(se=>{
    let started=false;
    ctx.strokeStyle=se.color; ctx.lineWidth=lw(2.2); ctx.beginPath();
    s.forEach((p,i)=>{
      if(!se.test(p)) return;
      const raw=Number(p[se.key]); if(isNaN(raw)||raw<=0) return;
      const v = se.scale? raw*se.scale : raw;
      if(started) ctx.lineTo(x(i),y(v)); else { ctx.moveTo(x(i),y(v)); started=true; }
    });
    ctx.stroke();
    ctx.fillStyle=se.color;
    const rr = Math.max(2.5, 4*f);
    s.forEach((p,i)=>{
      if(!se.test(p)) return;
      const raw=Number(p[se.key]); if(isNaN(raw)||raw<=0) return;
      const v = se.scale? raw*se.scale : raw;
      ctx.beginPath(); ctx.arc(x(i),y(v),rr,0,7); ctx.fill();
    });
  });
  ctx.fillStyle="#63799c"; ctx.font=px(11);
  const step = W<420 ? Math.ceil(n/4) : Math.ceil(n/8);   // 窄屏少标几个日期，别糊成一片
  s.forEach((p,i)=>{ if(n<=4 || i%step===0 || i===n-1) ctx.fillText(String(p.d).slice(5), x(i)-Math.round(11*f), H-Math.round(10*f)); });
}
/* 视口变化/横竖屏切换时重画（手机上经常转屏） */
let _chartTimer=null;
function scheduleChartResize(){
  if(TAB!=="scores") return;
  clearTimeout(_chartTimer);
  _chartTimer=setTimeout(()=>drawChart(), 150);
}
window.addEventListener("resize", scheduleChartResize);
window.addEventListener("orientationchange", scheduleChartResize);
function renderScoreList(){
  const box=document.getElementById("scoreList"); if(!box) return;
  const s=(DB.scores||[]).slice().reverse();
  if(!s.length){ box.innerHTML='<span class="muted">暂无记录</span>'; return; }
  box.innerHTML=s.map((p,ri)=>{
    const i=DB.scores.length-1-ri;
    const t = p.type==="en"? "六级" : "软考";
    const v = p.type==="en"? ("总分 "+(p.total||"-")) : ("上午 "+(p.am||"-")+" ｜ 下午 "+(p.pm||"-"));
    return '<div class="row between" style="padding:4px 0;border-bottom:1px solid #1a2740">'+
      '<span>'+esc(p.d)+'　<span class="tag">'+t+'</span></span><span class="mono">'+v+'</span>'+
      '<span><button class="ghost" data-del="'+i+'" style="padding:0 6px">删</button></span></div>';
  }).join("");
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    DB.scores.splice(+b.dataset.del,1); save(); renderScoreList(); drawChart();
  });
}
function renderSticky(){
  const t=today0(), k=dkey(t), rec=DB.checks[k];
  const T=todayTasks(t);
  const total=T.items.filter(i=>i.kind!=="tip").length;
  const n=rec&&rec.done? rec.done.length : 0;
  const h=DB.hours[k]; let hsum=0; if(h) Object.keys(h).forEach(x=>{ hsum+=Number(h[x]||0); });
  const el=document.getElementById("stickyTxt");
  if(el) el.innerHTML = n? ('今日 <b>'+n+'/'+total+'</b> 项'+(hsum?'　'+round1(hsum)+'h':'')) : '今天还没打卡';
}
function toast(m){
  const el=document.getElementById("toast"); el.textContent=m; el.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),2000);
}
function jumpToWeeks(scroll){
  TAB="weeks"; render();
  const wi=weekIndex(new Date());
  const el=document.querySelector('.wk[data-w="'+wi+'"]');
  if(el && scroll) setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"center"}),60);
}

/* ---------- 18. 交互绑定 ---------- */
function collectToday(){
  const t=today0(), k=dkey(t);
  const note=document.getElementById("note");
  const rec=dRec(k);
  if(note) rec.note=note.value.trim();
  const m=document.querySelector("#moodRow .mood.on"); if(m) rec.mood=m.dataset.m;
  const h={};
  document.querySelectorAll('#app [data-h]').forEach(inp=>{
    const v=parseFloat(inp.value);
    if(!isNaN(v) && v>0) h[inp.dataset.h]=v;
  });
  DB.hours[k]=h;
  return rec;
}
function saveToday(){
  const rec=collectToday();
  const n=(rec.done||[]).length;
  const hs=DB.hours[dkey(today0())]; let hsum=0; if(hs) Object.keys(hs).forEach(x=>{ hsum+=Number(hs[x]||0); });
  if(!n && !hsum && !rec.note){ toast("先勾一项、填小时或写点备注"); return; }
  save(); renderSticky();
  toast("已保存 · 完成 "+n+" 项"+(hsum? " · "+round1(hsum)+"h":""));
}
function bind(){
  const app=document.getElementById("app");
  app.querySelectorAll("[data-tab]").forEach(el=>{
    el.onclick=()=>{ TAB=el.dataset.tab; try{localStorage.setItem("ttp_tab",TAB);}catch(e){} render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  app.querySelectorAll("#todoList li").forEach(li=>{
    li.onclick=()=>{
      const t=today0(), k=dkey(t), rec=dRec(k);
      const T=todayTasks(t);
      const item=T.items[+li.dataset.i]; if(!item) return;
      const p=rec.done.indexOf(item.id);
      if(p>=0) rec.done.splice(p,1); else rec.done.push(item.id);
      save(); li.classList.toggle("done"); renderSticky();
      const total=T.items.filter(i=>i.kind!=="tip").length;
      const counter=li.closest(".card").querySelector(".tiny.muted");
      if(counter) counter.innerHTML="已勾 "+rec.done.length+" / "+total+" 项";
    };
  });
  app.querySelectorAll("#moodRow .mood").forEach(m=>{
    m.onclick=()=>{
      app.querySelectorAll("#moodRow .mood").forEach(x=>x.classList.remove("on"));
      m.classList.add("on"); dRec(dkey(today0())).mood=m.dataset.m; save();
    };
  });
  app.querySelectorAll('[data-h]').forEach(inp=>{ inp.onchange=()=>{ collectToday(); save(); renderSticky(); }; });
  const note=document.getElementById("note");
  if(note) note.onblur=()=>{ dRec(dkey(today0())).note=note.value.trim(); save(); };

  const b=(id,fn)=>{ const el=document.getElementById(id); if(el) el.onclick=fn; };

  b("saveBtn", saveToday);
  b("stickyBtn", saveToday);
  b("allBtn", ()=>{
    const t=today0(), rec=dRec(t), T=todayTasks(t);
    rec.done=T.items.filter(i=>i.kind!=="tip").map(i=>i.id);
    save(); render(); toast("已全部勾上（记得填小时）");
  });
  b("clearBtn", ()=>{
    if(!confirm("清空今天的打卡？")) return;
    const k=dkey(today0()); delete DB.checks[k]; delete DB.hours[k];
    save(); render(); toast("已清空今日");
  });
  b("addScore", ()=>{
    const type=document.getElementById("scType").value;
    const a=document.getElementById("inAM").value, p=document.getElementById("inPM").value;
    if(a===""&&p===""){ toast("至少填一个分数"); return; }
    DB.scores=DB.scores||[];
    const rec={d:dkey(today0()), type:type};
    if(type==="en") rec.total = a===""? "" : Number(a);
    else { rec.am = a===""? "" : Number(a); rec.pm = p===""? "" : Number(p); }
    DB.scores.push(rec);
    DB.scores.sort((x,y)=> x.d<y.d? -1 : 1);
    save(); document.getElementById("inAM").value=""; document.getElementById("inPM").value="";
    renderScoreList(); drawChart(); toast("已记录");
  });
  const scType=document.getElementById("scType");
  if(scType) scType.onchange=()=>{
    const en=scType.value==="en";
    const am=document.getElementById("inAM"), pm=document.getElementById("inPM");
    am.placeholder = en? "六级总分 0-710" : "软考上午 0-75";
    am.max = en? 710 : 75;
    pm.disabled = en; pm.placeholder = en? "六级不用填" : "软考下午 0-75";
    pm.style.opacity = en? .4 : 1;
  };
  b("bugAdd", ()=>{
    const el=document.getElementById("bugIn"); const t=el.value.trim();
    if(!t){ toast("写一句再存"); return; }
    DB.bugs=DB.bugs||[];
    DB.bugs.push({t:t, d:dkey(today0()), track:document.getElementById("bugTrack").value});
    save(); el.value=""; render(); toast("已加入本子");
  });
  app.querySelectorAll("[data-bd]").forEach(el=>el.onclick=()=>{
    DB.bugs.splice(+el.dataset.bd,1); save(); render();
  });
  b("bugExp", ()=>{
    const md = "# 错题 / 卡点本\n\n"+(DB.bugs||[]).map(x=>
      "- ["+x.d+"]（"+(TRACK[x.track]?TRACK[x.track].short:"—")+"）"+x.t).join("\n")+"\n";
    download("错题本_"+dkey(today0())+".md", md);
  });
  b("copyMonth", ()=>{
    const txt = "| 月份 | 上午正确率 | 下午得分 | 最烂板块 | 下月调整 |\n|---|---|---|---|---|\n"+
      Array.from({length:9},(_,i)=>{ const d=new Date(2026,8+i,1);
        return "| "+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+" | | | | |"; }).join("\n");
    copy(txt);
  });
  b("copyLan", ()=>{ copy(window.__TTP_LAN || location.href); });
  b("copyTpl", ()=>{ const el=document.getElementById("reviewTpl"); if(el) copy(el.value); });
  b("dlTpl", ()=>{ const el=document.getElementById("reviewTpl"); if(el) download("每周复盘模板.md", el.value); });
  b("jumpNow", ()=>jumpToWeeks(true));
  b("expandAll", ()=>{
    const all=app.querySelectorAll(".wdetail");
    const anyHidden=Array.from(all).some(x=>x.classList.contains("hide"));
    all.forEach(x=>x.classList.toggle("hide", !anyHidden));
    document.getElementById("expandAll").textContent = anyHidden? "收起全部" : "展开全部";
  });
  app.querySelectorAll(".wk").forEach(el=>{
    el.onclick=(ev)=>{
      if(ev.target.tagName==="BUTTON") return;
      const d=el.querySelector(".wdetail"); if(d) d.classList.toggle("hide");
    };
  });
  b("saveExams", ()=>{
    DB.exams = {
      rk:Object.assign({}, DEFAULT_EXAMS.rk, {date:document.getElementById("exRK").value}),
      ai:Object.assign({}, DEFAULT_EXAMS.ai, {date:document.getElementById("exAI").value}),
      en:Object.assign({}, DEFAULT_EXAMS.en, {date:document.getElementById("exEN").value})
    };
    save(); render(); toast("日期已更新");
  });
  b("resetExams", ()=>{ DB.exams=null; save(); render(); toast("已恢复默认日期"); });
  b("expBtn", ()=>{
    const data=Object.assign({}, DB, {_exportedAt:new Date().toISOString(), _plan:"三轨学习计划 v1"});
    download("三轨学习计划备份_"+dkey(today0())+".json", JSON.stringify(data,null,2), "application/json");
    toast("已导出");
  });
  b("impBtn", ()=>{ const f=document.getElementById("impFile"); if(f) f.click(); });
  const impFile=document.getElementById("impFile");
  if(impFile) impFile.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{ try{
      const o=JSON.parse(fr.result);
      if(!o||typeof o!=="object") throw 0;
      DB=Object.assign(JSON.parse(JSON.stringify(EMPTY)), o);
      save(); render(); toast("导入成功");
    }catch(err){ toast("文件格式不对"); } };
    fr.readAsText(f);
  };
  b("wipeBtn", ()=>{
    if(!confirm("会删掉全部打卡、成绩与错题，确定？")) return;
    if(!confirm("真的确定？建议先导出备份。")) return;
    localStorage.removeItem(KEY); DB=JSON.parse(JSON.stringify(EMPTY));
    render(); toast("已清空");
  });
}
function download(name, text, mime){
  const blob=new Blob([text],{type:(mime||"text/plain")+";charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}
function copy(txt){
  const done=()=>toast("已复制到剪贴板");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>{ legacyCopy(txt); done(); });
  } else { legacyCopy(txt); done(); }
}
function legacyCopy(txt){
  const ta=document.createElement("textarea"); ta.value=txt;
  ta.style.position="fixed"; ta.style.top="-1000px"; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand("copy"); }catch(e){} ta.remove();
}

  load();
  try{ const t=localStorage.getItem("ttp_tab"); if(t) TAB=t; }catch(e){}
  render();
  window.addEventListener("keydown", e=>{
    if((e.ctrlKey||e.metaKey) && e.key==="s"){ e.preventDefault(); saveToday(); }
  });
  console.log("[三轨学习计划] 就绪 · 今天 "+dkey(today0())+" · W"+(weekIndex(new Date())+1));
})();
